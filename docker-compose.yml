services:
  app:
    build: .
    image: keepsake-media:latest
    container_name: keepsake
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Paths inside the container (override any local-dev values from .env).
      DATA_DIR: /data
      DATABASE_URL: file:/data/app.db
      FFMPEG_PATH: /usr/bin/ffmpeg
    volumes:
      - keepsake-data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  keepsake-data:
